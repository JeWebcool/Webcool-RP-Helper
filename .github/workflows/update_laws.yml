name: Daily Laws Auto-Update

on:
  schedule:
    # Запуск каждый день в 7:00 утра по МСК (4:00 UTC)
    - cron: '0 4 * * *'
  workflow_dispatch: # Позволяет запускать обновление вручную с сайта GitHub

jobs:
  update-laws:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Run laws parser
        run: python scripts/parse_laws.py

      - name: Generate new keywords map
        run: python scripts/generate_keywords.py

      - name: Commit and push changes if laws updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database/
          git status
          git diff --staged --quiet || git commit -m "🤖 Auto-update laws database and keywords [skip ci]"
          git push